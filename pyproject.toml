[project]
name = "document-ingestion-reference"
version = "1.0.0"
description = "Serverless document ingestion on AWS: event-driven intake, Step Functions orchestration, human-in-the-loop review"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
