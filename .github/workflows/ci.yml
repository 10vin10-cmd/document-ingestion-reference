name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2

      - name: Lint
        run: ruff check .

      - name: Unit and infrastructure tests
        run: pytest

      - name: Synthesize (default and with search)
        run: |
          cdk synth --quiet
          cdk synth --quiet -c enableSearch=true
